name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # safe-write-mcp-core ships on npm (registry ^0.4.0 dependency in
      # package.json) — no sibling checkout needed. Bump the registry range
      # deliberately when the core ships changes.
      - run: npm ci
      - run: npm run lint
      - run: npm test